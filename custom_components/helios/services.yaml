fan_boost:
  name: Fan boost
  description: >-
    Runs the fan at a boost speed for a limited time, then restores the
    previous fan stage.
  fields:
    entity_id:
      name: Entity
      description: Fan entity to boost.
      example: fan.helios
      required: true
      selector:
        entity:
          integration: helios
          domain: fan
    speed:
      name: Speed
      description: "Boost speed. One of: off, low, medium, high, max"
      example: high
      required: true
      selector:
        select:
          options:
            - "off"
            - "low"
            - "medium"
            - "high"
            - "max"
    duration:
      name: Duration
      description: Duration of the boost in minutes.
      example: 60
      required: false
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min
